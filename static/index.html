<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chapter07 · 实时语音</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <main class="stage">
    <p class="brand">Chapter07 · Pipecat</p>
    <h1 class="title">对着我说话</h1>
    <p class="subtitle">Whisper 本地识别 · Gemini 理解意图 · Piper 播报 · 支持打断</p>

    <button class="mic-btn" id="btnMic" type="button" aria-pressed="false">
      <span class="mic-ring" aria-hidden="true"></span>
      <span class="mic-icon" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
          <path d="M12 3a4 4 0 0 0-4 4v4a4 4 0 0 0 8 0V7a4 4 0 0 0-4-4Z" stroke="currentColor" stroke-width="1.8"/>
          <path d="M5 11a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
    </button>
    <p class="mic-label" id="micLabel">点击开麦</p>

    <div class="meter" aria-hidden="true"><i id="meterBar"></i></div>

    <section class="chat" id="chat" aria-live="polite"></section>

    <section class="status-row">
      <span class="dot" id="dot"></span>
      <span id="statusText">未连接</span>
      <span class="sep">·</span>
      <span id="latencyText">延迟 —</span>
    </section>

    <p class="hint">开麦后直接说；机器人说话时插话即可打断（barge-in）</p>
  </main>

  <audio id="botAudio" autoplay playsinline></audio>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
